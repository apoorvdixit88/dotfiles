# ~/.tmux.conf — starter config focused on easy pane navigation

# --- Prefix: use Ctrl-a instead of the default Ctrl-b ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Truecolor: make Catppuccin & other 24-bit themes render correctly ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- No delay after Esc — makes nvim feel instant inside tmux ---
set -sg escape-time 0

# --- Bigger scrollback history (default is only 2000 lines) ---
set -g history-limit 50000

# --- Mouse support: click a pane to focus, drag borders to resize, scroll to scroll ---
set -g mouse on

# --- Switch panes WITHOUT the prefix: just hold Alt + arrow key ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Also allow prefix + arrow (Ctrl+b then arrow) to move between panes ---
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# --- Reliable pane nav with letter keys (Ctrl+b then h/j/k/l) — no arrow-key issues ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Split panes WITHOUT the prefix: Alt+\ (vertical/side-by-side), Alt+- (horizontal/stacked) ---
bind -n M-\\ split-window -h
bind -n M-- split-window -v

# --- Highlight the ACTIVE pane: thin lines, bold green active vs blue inactive ---
set -g pane-border-lines single
set -g pane-border-style        "fg=#89b4fa"
set -g pane-active-border-style "fg=#a6e3a1,bold"
set -g pane-border-indicators both

# --- Quality-of-life: start window/pane numbering at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1

# --- Reload this config quickly with:  prefix (Ctrl+a) then r ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"

# ============================================================
#  Plugins (managed by TPM)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore

# Also capture pane contents (scrollback) when saving
set -g @resurrect-capture-pane-contents 'on'
# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'

# --- Keep this line at the VERY BOTTOM of the file ---
run '~/.config/tmux/plugins/tpm/tpm'
