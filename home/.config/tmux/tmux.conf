# ~/.tmux.conf — starter config focused on easy pane navigation

# --- Mouse support: click a pane to focus, drag borders to resize, scroll to scroll ---
set -g mouse on

# --- Switch panes WITHOUT the prefix: just hold Alt + arrow key ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Also allow prefix + arrow (Ctrl+b then arrow) to move between panes ---
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# --- Reliable pane nav with letter keys (Ctrl+b then h/j/k/l) — no arrow-key issues ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Easier split keys: | for vertical, _ for horizontal (still need prefix) ---
bind | split-window -h
bind _ split-window -v

# --- Quality-of-life: start window/pane numbering at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1

# --- Reload this config quickly with:  Ctrl+b then r ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"
